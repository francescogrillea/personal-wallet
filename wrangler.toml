name = "personal-wallet"
main = "app/worker.py"
compatibility_date = "2026-08-26"

compatibility_flags = ["python_workers"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
